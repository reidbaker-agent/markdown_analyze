name: markdown_analyze
description: >-
  Deterministic static analysis and linting for Dart code blocks in Markdown
  files (SKILL.md, README.md, documentation, agent plans, and issues), with
  configurable sample-code diagnostic and lint defaults.
version: 0.1.0
repository: https://github.com/reidbaker-agent/markdown_analyze

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^14.4.0
  args: ^2.4.0
  meta: ^1.11.0
  path: ^1.9.1
  pub_semver: ^2.1.4
  source_span: ^1.10.0
  yaml: ^3.1.3

dev_dependencies:
  async: ^2.11.0
  checks: ^0.3.0
  collection: ^1.18.0
  http: ^1.2.0
  lints: ^6.0.0
  mockito: ^5.4.0
  test: ^1.24.0

executables:
  markdown_analyze:
